<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Itim&family=Monomaniac+One&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS ด้วยวิธี CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เตั้งค่า google font ใช้กับ tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              itim: ["Itim", "cursive"],
              monomaniac: ["Monomaniac One", "sans-serif"],
              raleway: ["Raleway", "sans-serif"],
              google: ["Google Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-black">
    <div class="w-full flex flex-col items-center justify-center">
      <!-- ส่วนของ navbar -->
      <div class="flex w-full mt-5 py-5 px-10">
        <!-- เมนูต่างๆ ชิดซ้าย -->
        <div class="w-full flex justify-start gap-8">
          <a href="#" class="text-white text-2xl font-monomaniac">Portfolio</a>
          <a href="#" class="text-white text-2xl font-monomaniac">About Me</a>
          <a href="#" class="text-white text-2xl font-monomaniac"
            >Get In Touch</a
          >
        </div>
        <!-- ข้อความ Hello อยู่ตรงกลาง -->
        <div class="w-full flex justify-center">
          <span class="mt-5 text-green-500 text-5xl font-itim">hello</span>
        </div>
        <!-- ไอคอนต่างๆ ชิดขวา -->
        <div class="w-full flex justify-end space-x-4">
          <a href="#" class="text-white text-2xl"
            ><i class="bi bi-github"></i
          ></a>
          <a href="#" class="text-white text-2xl"
            ><i class="bi bi-instagram"></i
          ></a>
          <a href="#" class="text-white text-2xl"
            ><i class="bi bi-twitter"></i
          ></a>
          <a href="#" class="text-white text-2xl"
            ><i class="bi bi-linkedin"></i
          ></a>
        </div>
      </div>

      <!-- ส่วนของ personal info -->
      <div class="flex flex-col items-center justify-center text-center mt-12">
        <span class="text-white text-5xl mt-[50px] font-monomaniac"
          >6819M10002</span
        >
        <span class="text-white text-5xl mt-[50px] font-monomaniac"
          >Wisanu Mangkala</span
        >
        <span class="text-green-500 text-5xl mt-[50px] font-monomaniac"
          >Freelance Web Devloper</span
        >
        <span class="text-white text-5xl mt-[50px] font-monomaniac"
          >Based In THAILAND</span
        >
      </div>

      <!-- ส่วนของ personal picture -->
      <div class="">
        <img
          class="mt-10 w-[500px] h-[250px] rounded-full object-cover object-center mx-auto border-green-500 border-4"
          src="./images/person.png"
          alt="person"
        />
      </div>
    </div>
  </body>
</html>
